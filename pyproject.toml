[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glowback"
version = "0.7.2"
description = "Ambient light for monitors with RGB LEDs on the back: every LED follows the screen in real time. Windows Dynamic Lighting (HID LampArray) and OpenRGB devices, HDR, tray app, 6 languages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Ilyomix" }]
keywords = ["ambient-light", "bias-lighting", "rgb", "screen-sync", "dynamic-lighting", "lamparray", "openrgb", "hid", "monitor", "windows", "gaming", "led", "ambilight-alternative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/Ilyomix/glowback"
Issues = "https://github.com/Ilyomix/glowback/issues"

[project.scripts]
glowback = "glowback:main"

[project.gui-scripts]
glowback-bg = "glowback:main"

[tool.setuptools]
py-modules = ["glowback"]
