name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build glowback.exe (command line) and GlowbackTray.exe (no console)
        run: |
          python -m pip install pyinstaller
          pyinstaller --onefile --console --name glowback --icon assets/glowback.ico glowback.py
          pyinstaller --onefile --noconsole --name GlowbackTray --icon assets/glowback.ico glowback.py
          dist\glowback.exe --version
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/glowback.exe
            dist/GlowbackTray.exe
          generate_release_notes: true
