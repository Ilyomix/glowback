name: "Bug report"
description: "Something does not work as expected"
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: list
    attributes:
      label: Output of `glowback --list`
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log (%LOCALAPPDATA%\Glowback\glowback.log)
      render: text
  - type: input
    id: version
    attributes:
      label: Glowback version (`glowback --version`) and Windows version
